[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-core"
version = "0.1.0"
description = "Unified quant engine for AlphaScope"
requires-python = ">=3.11"
dependencies = [
  "akshare>=1.16.82",
  "numpy>=2.2.3",
  "pandas>=2.2.3",
  "pytz>=2024.2"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
