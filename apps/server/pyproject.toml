[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "limitboard-server"
version = "0.1.0"
description = "FastAPI backend for AlphaScope"
requires-python = ">=3.11"
dependencies = [
  "apscheduler>=3.10.4",
  "fastapi>=0.115.8",
  "pandas>=2.2.3",
  "pydantic-settings>=2.8.1",
  "pytz>=2024.2",
  "supabase>=2.13.0",
  "uvicorn>=0.34.0"
]

[project.scripts]
limitboard-fetch = "limitboard_server.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
